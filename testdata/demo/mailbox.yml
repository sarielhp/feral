# The synthetic mailbox the README's demo GIF is recorded on
# (tools/demo_mbox.rb turns it into mbox files, tools/demo_gif records it).
#
# Every person, address and list here is made up, and every address is on a
# domain reserved for examples (RFC 2606), so nothing in it can reach anyone.
# `at` is hours after first_day; `account` defaults to the first account.

